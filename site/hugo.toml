# mapx Landing (mapx.at). Hugo extended >= 0.134 (getestet 0.169.0), Theme Hextra v0.9.7 (git-Submodule site/themes/hextra, gepinnt).
# Build: ./build.sh (schreibt index.html, en/ und die Theme-Assets ins Repo-Wurzel). Texte: content/_index.<lang>.md, Footer: data/<lang>.yaml.
baseURL = "https://mapx.at/"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
title = "mapx"
theme = "hextra"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT", "section", "page"]
enableRobotsTXT = false
disableHugoGeneratorInject = true

[markup.goldmark.renderer]
  unsafe = true

[params]
  [params.theme]
    default = "system"
    displayToggle = true
  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "normal"
    [params.navbar.logo]
      path = "img/logo.svg"
      dark = "img/logo.svg"
      width = 28
      height = 28
  [params.footer]
    displayCopyright = false
    displayPoweredBy = true
    width = "normal"
  [params.search]
    enable = false
  [params.page]
    width = "wide"
  [params.editURL]
    enable = false

[languages]
  [languages.de]
    label = "Deutsch"
    weight = 1
    locale = "de"
