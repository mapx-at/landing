devsec:
  eyebrow: "Für Entwickler"
  h2: "Einbinden in fünf Minuten."
  sub: "Kacheln sind PMTiles-Dateien mit HTTP-Range-Zugriff, ohne eigenen Kartenserver. Die Höhen-API antwortet mit GeoJSON."
  items:
    - "<b>MapLibre und PMTiles.</b> Der Stil der Demo-Karte ist öffentlich und lässt sich direkt laden."
    - "<b>Ein kostenloses Konto genügt.</b> Anmelden, Token anlegen, loslegen. Herkunft, Stichtag und Attribution stehen je Produkt in der Doku."
    - "<b>Maschinenlesbar.</b> OpenAPI-Beschreibung und <code>llms.txt</code> für die Höhen-API und die Kacheln."
  doc: "Zur Entwicklerdoku"
  demo: "Demo ansehen"
  bar1: "Karte mit MapLibre"
  bar2: "Höhe abfragen"
  comment: "// Gipfelhöhe aus dem Geländemodell (DTM, 1 m); Token vom Konto"
access:
  eyebrow: "API-Zugang"
  h2: "Kostenlos, mit eigenem Konto."
  sub: "Die mapx-APIs (Kacheln, Suche, Routing, Höhe) brauchen seit dem 08.11.2026 ein Konto mit API-Token. Das kostet nichts: Registrieren, anmelden, Token anlegen."
  steps:
    - {t: "1. Registrieren", d: "Mit deiner E-Mail-Adresse. Die Anmeldung läuft über einen 8-stelligen Code, den wir dir per Mail schicken. Ein Passwort gibt es nicht."}
    - {t: "2. Tokens anlegen", d: "Beliebig viele, jeweils mit eigenem Namen. Du kannst sie jederzeit sperren, erneuern oder löschen."}
    - {t: "3. Nutzung einsehen", d: "Für jeden Token siehst du die Nutzung je Produkt und Tag. Abgerechnet wird nichts."}
  kinds: "Zwei Arten von Tokens"
  pk: "<b>Öffentlicher Token (<code>mx_pk_…</code>).</b> Für Webseiten und Apps. Er darf nur lesen und ist an deine Domains oder an deine Android-App gebunden, so kann ihn niemand sonst verwenden."
  sk: "<b>Geheimer Token (<code>mx_sk_…</code>).</b> Für deinen Server oder Skripte. Nie in eine Webseite oder App einbauen."
  note: "Zum Schutz vor Missbrauch gibt es Rate-Limits je Token. Die Nutzung selbst ist kostenlos."
  signup: "Kostenlos registrieren"
  signin: "Anmelden"
  docs: "Details in der Doku"
  docsHref: "https://docs.mapx.at/de/start/access-and-limits/"
data:
  eyebrow: "Warum amtliche Daten"
  h2: "Eine Quelle, die man benennen kann."
  sub: "mapx baut Karten ausschließlich aus Daten von Behörden mit klarer offener Lizenz. Jeder Datensatz ist mit Herausgeber, Stichtag und Lizenz dokumentiert."
  facts:
    - "<b>Kataster, Gelände, Orthofoto:</b> Bundesamt für Eich- und Vermessungswesen (BEV)."
    - "<b>Straßen, Bahn, Routing:</b> Graphenintegrations-Plattform GIP.at."
    - "<b>Gewässer:</b> Gesamtgewässernetz des Umweltbundesamts."
    - "<b>Kein OpenStreetMap:</b> Punkte von Interesse kommen ebenfalls aus amtlichen Quellen."
  blog: "Mehr im Blog"
  alt: "Stilisierte Karte mit Höhenlinien, Parzellen, Straßen und Fluss"
