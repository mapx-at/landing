# Interaktive Produktbeispiele der Themenseiten (Shortcode {{< demo id="…" >}}, Skripte static/lp/demo/<id>.js,
# Vorschaubild static/lp/img/demo/<id>.webp, erzeugt von tools/demo-shots.mjs). docs = Beispiel-ID auf docs.mapx.at/examples/.
# leaflet: false = das Beispiel braucht keine Kartenbibliothek.
karten:
  docs: switch-basemap
  de: {h: Ausprobieren, p: 'Dieselbe Stelle in Innsbruck in vier fertigen Stilen: Tag, Gelände, Luftbild und Nacht.', alt: 'Innsbruck in vier Kartenstilen nebeneinander: Straßen, Gelände, Luftbild, Nacht'}
  en: {h: Try it, p: 'The same spot in Innsbruck in four ready-made styles: day, terrain, aerial and night.', alt: 'Innsbruck in four map styles side by side: streets, terrain, aerial, night'}
geocoding:
  docs: search-box
  de: {h: Ausprobieren, p: 'Such eine Adresse oder einen Ort in Österreich: Du bekommst Vorschläge beim Tippen, der Treffer erscheint auf der Karte.', alt: 'Suchfeld mit „Hauptplatz 1, Li“, Vorschläge Linz und Traun, Treffer am Linzer Hauptplatz auf der Karte'}
  en: {h: Try it, p: 'Search for an address or place in Austria: suggestions while you type, the result appears on the map.', alt: 'Search box with “Hauptplatz 1, Li”, suggestions Linz and Traun, result on Linz main square on the map'}
routing:
  docs: route
  de: {h: Ausprobieren, p: 'Vom Bahnhof Melk über die Donau nach Emmersdorf, mit Auto, Rad oder zu Fuß: Zieh die Pins A und B, Länge und Dauer rechnen sich neu.', alt: 'Autoroute von Melk nach St. Pölten mit Dauer und Länge'}
  en: {h: Try it, p: 'From Melk station across the Danube to Emmersdorf, by car, bike or on foot: drag pins A and B and the length and duration update.', alt: 'Car route from Melk to St. Pölten with duration and length'}
hoehe:
  docs: elevation-profile
  de: {h: Ausprobieren, p: 'Eine Linie in den Hohen Tauern als Höhenprofil: Fahr mit Finger oder Maus darüber, der Punkt auf der Karte wandert mit. Weitere Punkte setzt du per Tipp.', alt: 'Großglockner-Hochalpenstraße von Heiligenblut zur Kaiser-Franz-Josefs-Höhe und ihr Höhenprofil mit höchstem Punkt, Anstieg und Länge'}
  en: {h: Try it, p: 'A line in the Hohe Tauern as an elevation profile: move your finger or mouse along it and the point on the map follows. Tap to add more points.', alt: 'Grossglockner High Alpine Road from Heiligenblut to Kaiser-Franz-Josefs-Höhe and its elevation profile with highest point, ascent and length'}
oev:
  docs: departures
  de: {h: Ausprobieren, p: 'Die Abfahrtstafel des Salzburger Hauptbahnhofs laut Fahrplan. Tipp auf einen blauen Punkt, um zu einer anderen Haltestelle zu wechseln.', alt: 'Abfahrtstafel des Salzburger Hauptbahnhofs mit drei Abfahrten laut Fahrplan, darunter die Haltestelle auf der Karte'}
  en: {h: Try it, p: 'The departure board of Salzburg main station according to the timetable. Tap a blue dot to switch to another stop.', alt: 'Departure board of Salzburg main station with three timetable departures, the stop on the map below'}
verkehr:
  docs: traffic
  de: {h: Ausprobieren, p: 'Die aktiven Verkehrsmeldungen im Kartenausschnitt, Sperren in Rot. Verschieb die Karte, um andere Gegenden zu sehen.', alt: 'Verkehrskarte von Wien mit Sperren in Rot und Baustellen in Orange, eine Sperre hervorgehoben'}
  en: {h: Try it, p: 'The active traffic reports in the visible area, closures in red. Pan the map to see other areas.', alt: 'Traffic map of Vienna with closures in red and roadworks in orange, one closure highlighted'}
statisch:
  docs: static-image
  leaflet: false
  de: {h: Ausprobieren, p: 'Wähl Ort, Stil und Größe: Daraus entsteht die Bild-URL. Das Bild lädt erst, wenn du es erzeugst.', alt: 'Fertiges Kartenbild von Melk mit Weg und Markierung, darunter die Bild-URL'}
  en: {h: Try it, p: 'Choose a place, style and size to build the image URL. The image loads only when you create it.', alt: 'Finished map image of Melk with a path and a pin, the image URL below'}
wetter:
  docs: weather-overlay
  de: {h: Ausprobieren, p: 'Temperatur oder Niederschlag der nächsten Stunden über Österreich: Mit dem Regler wählst du die Stunde.', alt: 'Temperaturfläche über Österreich mit Farbskala und Messwerten für Wien und Innsbruck'}
  en: {h: Try it, p: 'Temperature or precipitation for the coming hours over Austria: use the slider to pick the hour.', alt: 'Temperature layer over Austria with colour scale and readings for Vienna and Innsbruck'}
