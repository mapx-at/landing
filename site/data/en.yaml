devsec:
  eyebrow: "For developers"
  h2: "Embed it in five minutes."
  sub: "Tiles are PMTiles files with HTTP range access, no map server of your own needed. The elevation API answers with GeoJSON."
  items:
    - "<b>MapLibre and PMTiles.</b> The style of the demo map is public and can be loaded directly."
    - "<b>A free account is all you need.</b> Sign in, create a token, get going. Origin, reference date and attribution are listed per product in the docs."
    - "<b>Machine-readable.</b> OpenAPI description and <code>llms.txt</code> for the elevation API and the tiles."
  doc: "Go to the developer docs"
  demo: "See the demo"
  bar1: "Map with MapLibre"
  bar2: "Query elevation"
  comment: "// Summit elevation from the terrain model (DTM, 1 m); token from your account"
access:
  eyebrow: "API access"
  h2: "Free, with your own account."
  sub: "The mapx APIs (tiles, search, routing, elevation) require an account with an API token as of 8 November 2026. It costs nothing: sign up, sign in, create a token."
  steps:
    - {t: "1. Sign up", d: "With your email address. Sign-in uses an 8-digit code we send you by email. There is no password."}
    - {t: "2. Create tokens", d: "As many as you like, each with its own name. Block, renew or delete them at any time."}
    - {t: "3. See your usage", d: "For every token you can see usage per product and day. Nothing is billed."}
  kinds: "Two kinds of tokens"
  pk: "<b>Public token (<code>mx_pk_…</code>).</b> For websites and apps. It is read-only and bound to your domains or your Android app, so nobody else can use it."
  sk: "<b>Secret token (<code>mx_sk_…</code>).</b> For your server or scripts. Never put it in a web page or an app."
  note: "To protect against abuse there are rate limits per token. Usage itself is free of charge."
  signup: "Sign up for free"
  signin: "Sign in"
  docs: "Details in the docs"
  docsHref: "https://docs.mapx.at/start/access-and-limits/"
data:
  eyebrow: "Why official data"
  h2: "A source you can name."
  sub: "mapx builds maps exclusively from data of public authorities under a clear open licence. Every dataset is documented with publisher, reference date and licence."
  facts:
    - "<b>Cadastre, terrain, orthophoto:</b> Federal Office of Metrology and Surveying (BEV)."
    - "<b>Roads, rail, routing:</b> Graph Integration Platform GIP.at."
    - "<b>Water:</b> national water network of the Umweltbundesamt."
    - "<b>No OpenStreetMap:</b> points of interest also come from official sources."
