# Galerie der Kartenstile (/galerie/, /en/gallery/), Layout layouts/gallery.html, Skript /lp/gallery.js.
# Je Karte ein oder mehrere Stile (variants, erster = Standard im Raster ist "img"). map: Hash für https://map.mapx.at
# (leer = kein Link, weil der Viewer diesen Stil nicht als eigene Ansicht hat). Bilder: static/lp/img/gallery/<id>.webp,
# neu erzeugen mit site/tools/gallery-shots.mjs. Ausschnitt der Live-Karte im Fenster: center/zoom, bei 3D-Karten dazu pitch/bearing
# (pitch > 0 macht die Karte im Fenster dreh- und neigbar).
- key: streets
  img: streets
  center: [16.3725, 48.2085]
  zoom: 14.5
  variants:
    - {id: streets-dawn, de: Morgen, en: Dawn, map: ""}
    - {id: streets, de: Tag, en: Day, map: "c=16.3725,48.2085,14.5&l=l", default: true}
    - {id: streets-dusk, de: Abend, en: Dusk, map: ""}
    - {id: streets-night, de: Nacht, en: Night, map: "c=16.3725,48.2085,14.5&l=d"}
  de:
    name: Straßen
    place: Wien Innenstadt
    alt: "Stil streets: Wiener Innenstadt mit Straßen, Gebäuden und Namen"
    short: "Die Basiskarte mit Straßen, Orten und Gebäuden, in vier Tageszeiten."
    text: "Baut auf der Vektor-Basiskarte aus amtlichen Daten auf: Straßen und Bahn aus GIP.at, Gebäude, Adressen und Namen des BEV, Gewässer des Umweltbundesamts. Gedacht als ruhiger Hintergrund zum Suchen, Orientieren und für eigene Punkte. Morgen, Abend und Nacht färben dieselbe Karte nach dem Licht um; die Nacht passt zu Seiten mit dunklem Design."
  en:
    name: Streets
    place: Vienna city centre
    alt: "Style streets: Vienna city centre with roads, buildings and names"
    short: "The base map with roads, places and buildings, in four times of day."
    text: "Built on the vector base map from official data: roads and rail from GIP.at, buildings, addresses and names from BEV, water bodies from the Environment Agency Austria. Meant as a calm background for search, orientation and your own points. Dawn, dusk and night recolour the same map to match the light; night suits pages with a dark design."
- key: light
  img: light
  center: [15.4385, 47.0710]
  zoom: 13.5
  variants:
    - id: light
      de: Hell
      en: Light
      map: ""
      default: true
      text:
        de: "Baut auf der Basiskarte auf, nimmt ihr aber fast alle Farbe und blendet Symbole, Hausnummern und Straßenschilder aus. Gedacht als Hintergrund für eigene Punkte, Linien und Flächen, die darauf klar hervortreten. Orte, Straßen und Gewässer bleiben in Grautönen lesbar."
        en: "Builds on the base map but removes almost all colour and hides icons, house numbers and road shields. Meant as a backdrop for your own points, lines and areas, which stand out clearly. Places, roads and water remain legible in shades of grey."
    - id: dark
      de: Dunkel
      en: Dark
      map: ""
      text:
        de: "Die dunkle Schwester von Hell: neutrales Anthrazit statt Nachtblau, Straßen als hellere Linien, Schrift hellgrau. Gedacht für Dashboards, Leitstände und dunkle Oberflächen, auf denen eigene Daten in kräftigen Farben leuchten. Wasser liegt etwas dunkler als das Land."
        en: "The dark sibling of Light: neutral charcoal instead of night blue, roads as lighter lines, labels in light grey. Meant for dashboards, control rooms and dark interfaces where your own data shows in strong colours. Water sits slightly darker than land."
  de:
    name: Hell und Dunkel
    place: Graz
    alt: "Stile light und dark: ruhige graue Karte von Graz"
    short: "Ruhige, fast farblose Grundkarte für eigene Daten, hell oder auf dunklem Anthrazit."
    text: ""
  en:
    name: Light and Dark
    place: Graz
    alt: "Styles light and dark: calm grey map of Graz"
    short: "Calm, almost colourless base map for your own data, light or on dark charcoal."
    text: ""
- key: satellite
  img: satellite-streets
  center: [15.333, 48.228]
  zoom: 15.2
  variants:
    - {id: satellite, de: Luftbild, en: Aerial, map: ""}
    - {id: satellite-streets, de: Mit Straßen, en: With streets, map: "c=15.333,48.228,15.2&a=luftbild&l=l", default: true}
    - {id: satellite-current, de: Satellit aktuell, en: Current satellite, map: "c=15.333,48.228,12&a=luftbild&b=e&l=l"}
  de:
    name: Luftbild
    place: Melk mit Stift
    alt: "Stil satellite-streets: Orthofoto von Melk mit Stift, Straßen und Namen"
    short: "Orthofoto des BEV, auf Wunsch mit Straßen, oder ein aktuelles Satellitenbild."
    text: "Baut auf dem Digitalen Orthofoto des BEV auf (20 cm, Befliegung 2022–2025); „Satellit aktuell“ nutzt stattdessen Sentinel-2-Aufnahmen von Copernicus mit 10 m, täglich fortgeschrieben. Gedacht für Lagepläne, Standortansichten und überall dort, wo man sehen will, wie es vor Ort aussieht. „Mit Straßen“ und „Satellit aktuell“ legen Straßen, Namen und Grenzen der Basiskarte darüber."
  en:
    name: Aerial
    place: Melk abbey
    alt: "Style satellite-streets: orthophoto of Melk abbey with roads and names"
    short: "BEV orthophoto, optionally with streets, or a current satellite image."
    text: "Built on the BEV digital orthophoto (20 cm, flown 2022–2025); “Current satellite” uses Copernicus Sentinel-2 imagery at 10 m instead, updated daily. Meant for site plans, location views and anywhere you want to see what a place looks like. “With streets” and “Current satellite” add roads, names and boundaries from the base map on top."
- key: outdoors
  img: outdoors
  center: [10.985, 46.958]
  zoom: 13
  variants:
    - id: outdoors
      de: Sommer
      en: Summer
      map: "c=10.985,46.958,13&a=outdoor&l=l"
      default: true
      text:
        de: "Baut auf der Basiskarte und dem Geländemodell des BEV aus Laserscan (1 m) auf. Gedacht für Karten zum Wandern, für Touren und alles, wo das Gelände zählt. Zeigt zusätzlich Höhenlinien mit Höhenangaben, Schummerung, Gipfel mit Höhe, Gletscher, Wege und Steige, Seilbahnen und Skigebiete."
        en: "Built on the base map and the BEV terrain model from laser scanning (1 m). Meant for hiking maps, tours and anything where the terrain matters. Adds contour lines with heights, hillshading, peaks with elevation, glaciers, paths and trails, cable cars and ski areas."
    - id: outdoors-winter
      de: Winter
      en: Winter
      map: ""
      text:
        de: "Dieselbe Geländekarte für die Wintersaison: Schummerung und Höhenlinien aus dem amtlichen Geländemodell, Gipfel und Wege bleiben, die Palette wechselt auf Weiß und Blaugrau mit eisblauen Gletschern. Zusätzlich hervorgehoben sind Skigebiete sowie Seilbahnen und Lifte."
        en: "The same terrain map for the winter season: hillshade and contours from the official terrain model, peaks and trails remain, the palette changes to white and blue-grey with icy glaciers. Ski areas, cable cars and lifts are additionally highlighted."
  de:
    name: Gelände
    place: Sölden
    alt: "Stil outdoors: Sölden mit Höhenlinien, Schummerung, Gipfeln, Wegen und Seilbahnen"
    short: "Höhenlinien, Schummerung, Gipfel und Wege für Karten im Gebirge, im Sommer oder in Schneefarben."
    text: ""
  en:
    name: Outdoors
    place: Sölden
    alt: "Style outdoors: Sölden with contour lines, hillshading, peaks, trails and cable cars"
    short: "Contours, hillshading, peaks and paths for maps in the mountains, in summer or in snow colours."
    text: ""
- key: relief
  img: relief
  center: [12.694, 47.074]
  zoom: 11.5
  variants:
    - id: relief
      de: Farbe
      en: Colour
      map: ""
      default: true
      text:
        de: "Eine reine Reliefkarte aus dem Geländemodell des BEV aus Laserscan (1 m): Höhenstufen von grünen Tälern über Ocker und Braun bis zu weißen Gipfeln, dazu kräftige Schummerung. Gedacht für Übersichten, Poster und überall dort, wo die Landschaft selbst das Thema ist. Straßen, Gebäude und Symbole fehlen bewusst; Gewässer, Gipfel mit Höhe und wenige Ortsnamen bleiben."
        en: "A pure relief map from the BEV terrain model from laser scanning (1 m): elevation tints from green valleys through ochre and brown to white summits, with strong hillshading. Meant for overviews, posters and anywhere the landscape itself is the subject. Roads, buildings and icons are deliberately left out; water, peaks with elevation and a few place names remain."
    - id: relief-contours
      de: Höhenlinien
      en: Contours
      map: ""
      text:
        de: "Die farbige Reliefkarte mit Höhenlinien und Höhenangaben. Gedacht für alle, die Höhen ablesen wollen, ohne Straßen und Wege im Bild zu haben."
        en: "The coloured relief map with contour lines and heights. Meant for reading elevations without roads and paths in the picture."
    - id: relief-light
      de: Hell
      en: Light
      map: ""
      text:
        de: "Nur graue Schummerung auf hellem Grund, mit hellen Gewässern und wenigen grauen Namen. Gedacht als plastischer Hintergrund für eigene Daten, die farbig darauf stehen."
        en: "Grey hillshading only on a light ground, with pale water and a few grey names. Meant as a sculpted backdrop for your own data shown in colour on top."
    - id: relief-dark
      de: Dunkel
      en: Dark
      map: ""
      text:
        de: "Dieselbe Schummerung als Licht auf dunklem Anthrazit, passend zum Stil „Dunkel“. Gedacht für Dashboards und dunkle Oberflächen, auf denen das Gelände dezent mitläuft."
        en: "The same hillshading as light on dark charcoal, matching the “Dark” style. Meant for dashboards and dark interfaces where the terrain stays quietly in the background."
  de:
    name: Relief
    place: Großglockner
    alt: "Stil relief: Großglockner als farbige Reliefkarte mit Höhenstufen, Schummerung, Gletschern und Gipfelnamen"
    short: "Reine Reliefkarte aus dem Geländemodell: farbige Höhenstufen, mit Höhenlinien oder nur als Schummerung in Hell und Dunkel."
    text: ""
  en:
    name: Relief
    place: Grossglockner
    alt: "Style relief: Grossglockner as a coloured relief map with elevation tints, hillshading, glaciers and peak names"
    short: "Pure relief map from the terrain model: elevation tints, with contours, or hillshade only in light and dark."
    text: ""
- key: traffic
  img: traffic-day
  center: [16.37, 48.175]
  zoom: 11.6
  variants:
    - {id: traffic-day, de: Tag, en: Day, map: "c=16.37,48.175,11.6&a=verkehr&l=l", default: true}
    - {id: traffic-night, de: Nacht, en: Night, map: ""}
  de:
    name: Verkehr
    place: Wien, A23 und A4
    alt: "Stil traffic-day: Wien mit eingefärbter Verkehrslage auf Autobahnen und Verkehrsmeldungen"
    short: "Die Basiskarte mit Verkehrslage und Verkehrsmeldungen auf Autobahnen und Schnellstraßen, für Tag und Nacht."
    text: "Baut auf der Basiskarte „Straßen“ auf, wahlweise in der Tag- oder der Nachtfassung. Gedacht für Karten rund um Anfahrt, Logistik und Unterwegssein. Zeigt zusätzlich die gemeldete Verkehrslage auf Autobahnen und Schnellstraßen in vier Stufen von frei bis Stau sowie Strecken mit Verkehrsmeldungen, beides aus Daten der ASFINAG / EVIS.AT."
  en:
    name: Traffic
    place: Vienna, A23 and A4
    alt: "Style traffic-day: Vienna with colour-coded traffic flow on motorways and traffic reports"
    short: "The base map with traffic flow and traffic reports on motorways and expressways, for day and night."
    text: "Built on the “Streets” base map, in its day or night version. Meant for maps about getting there, logistics and being on the road. Adds the reported traffic flow on motorways and expressways in four levels from free to jammed, plus road sections with traffic reports, both from ASFINAG / EVIS.AT data."
- key: terrain3d
  img: relief-3d
  center: [12.694, 47.074]
  zoom: 12.5
  pitch: 60
  bearing: 0
  variants:
    - {id: relief-3d, de: Relief, en: Relief, map: "", default: true}
    - {id: outdoors-3d, de: Sommer, en: Summer, map: ""}
    - {id: outdoors-winter-3d, de: Winter, en: Winter, map: ""}
  de:
    name: 3D-Gelände
    place: Großglockner
    alt: "Stil relief-3d: Großglockner als geneigte 3D-Ansicht mit Gletschern, Gipfeln und Tälern"
    short: "Die Geländekarten geneigt über dem echten Geländemodell, als Relief, im Sommer oder im Winter."
    text: "Legt die Karte über das Geländemodell des BEV aus Laserscan (1 m), sodass Berge und Täler als Körper erscheinen. Gedacht für Tourenplanung, Präsentationen und überall dort, wo man das Gelände begreifen will. Im Fenster lässt sich die Karte drehen und neigen (rechte Maustaste oder zwei Finger). Braucht MapLibre mit 3D-Gelände; Bildkacheln und Kartenbilder gibt es für 3D-Stile nicht."
  en:
    name: 3D terrain
    place: Grossglockner
    alt: "Style relief-3d: Grossglockner as a tilted 3D view with glaciers, peaks and valleys"
    short: "The terrain maps tilted over the real terrain model, as relief, in summer or in winter."
    text: "Drapes the map over the BEV terrain model from laser scanning (1 m), so mountains and valleys appear as solid shapes. Meant for tour planning, presentations and anywhere you want to grasp the terrain. In this window you can rotate and tilt the map (right mouse button or two fingers). Needs MapLibre with 3D terrain; raster tiles and static images are not available for 3D styles."
- key: aerial3d
  img: satellite-3d
  center: [13.6455, 47.5605]
  zoom: 14.7
  pitch: 60
  bearing: 250
  variants:
    - {id: satellite-3d, de: Luftbild, en: Aerial, map: "", default: true}
    - {id: satellite-streets-3d, de: Mit Straßen, en: With streets, map: ""}
  de:
    name: 3D-Luftbild
    place: Hallstatt
    alt: "Stil satellite-3d: Hallstatt am See mit der Bergwand dahinter als 3D-Ansicht aus dem Orthofoto"
    short: "Das Orthofoto des BEV über dem Geländemodell, pur oder mit Straßen und Namen."
    text: "Legt das Digitale Orthofoto des BEV (20 cm) über das Geländemodell. Gedacht für Standortansichten, Tourismus und alles, wo ein Ort so aussehen soll wie in Wirklichkeit. „Mit Straßen“ ergänzt Straßen, Namen und Grenzen der Basiskarte. Im Fenster lässt sich die Karte drehen und neigen."
  en:
    name: 3D aerial
    place: Hallstatt
    alt: "Style satellite-3d: Hallstatt on the lake with the rock face behind as a 3D view from the orthophoto"
    short: "The BEV orthophoto over the terrain model, plain or with streets and names."
    text: "Drapes the BEV digital orthophoto (20 cm) over the terrain model. Meant for location views, tourism and anything where a place should look as it does in reality. “With streets” adds roads, names and boundaries from the base map. In this window you can rotate and tilt the map."
- key: city3d
  img: streets-3d
  center: [16.3725, 48.2085]
  zoom: 15.6
  pitch: 60
  bearing: -20
  variants:
    - {id: streets-3d, de: Tag, en: Day, map: "", default: true}
    - {id: streets-night-3d, de: Nacht, en: Night, map: ""}
    - {id: light-3d, de: Hell, en: Light, map: ""}
    - {id: dark-3d, de: Dunkel, en: Dark, map: ""}
  de:
    name: 3D-Stadt
    place: Wien Innenstadt
    alt: "Stil streets-3d: Wiener Innenstadt schräg von oben mit Gebäuden als Körper in ihrer Höhe"
    short: "Gebäude als Körper in ihrer Höhe, bei Tag, bei Nacht oder neutral in Hell und Dunkel."
    text: "Zeigt die Gebäude der Basiskarte als Körper mit ihrer Höhe aus den Daten des BEV. Gedacht für Stadtansichten, Standortkarten und eigene Daten im städtischen Raum. Die Körper erscheinen ab etwa Zoomstufe 15; einzelne große Bauten haben in den Daten keine Höhe und bleiben flach. Im Fenster lässt sich die Karte drehen und neigen."
  en:
    name: 3D city
    place: Vienna city centre
    alt: "Style streets-3d: Vienna city centre from above at an angle with buildings as solid shapes at their height"
    short: "Buildings as solid shapes at their height, by day, by night, or neutral in light and dark."
    text: "Shows the buildings of the base map as solid shapes with their height from BEV data. Meant for city views, location maps and your own data in urban areas. The shapes appear from about zoom level 15; a few large buildings have no height in the data and stay flat. In this window you can rotate and tilt the map."
