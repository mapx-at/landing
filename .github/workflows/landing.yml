name: landing
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build-check:
    runs-on: [self-hosted, ci-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hugo extended 0.169.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tgz" https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_extended_0.169.0_linux-amd64.tar.gz
          echo "c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d  $RUNNER_TEMP/hugo.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/hugo.tgz" -C "$RUNNER_TEMP/bin" hugo
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Eingechecktes Build-Ergebnis ist aktuell (site/ -> index.html, lp/)
        run: site/build.sh --check
      - name: Bestand vorhanden
        run: test -f style.json && test -d styles && test -d tools && test -f CNAME && test -f legacy-viewer.html && test -f lp/legacy-redirect.js
