<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mapx.at – Vektor-Basemap</title>
<meta name="description" content="mapx.at – Vektor-Basemap nach basemap.at-Vorbild aus offenen Daten (BEV DKM, GIP, GGN, Verwaltungsgrenzen, Geographische Namen, Adressregister): Bezirke Melk, Landeck und Gmunden, Verwaltungsgrenzen für ganz Österreich.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#134e4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23134e4a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%235eead4' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%235eead4' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js" integrity="sha384-QfbOCebHNw8pQiPAOd2IFee2v2A5VYZxBk0+JGZ5H+3mfzVIp6zsQNkTsfGJot93" crossorigin="anonymous"></script>
<style>
:root{--panel:rgba(255,255,255,.94);--fg:#1b2b2a;--muted:#5b6b69;--line:#d9d4c7;--acc:#0f766e;--bg:#f2efe6}
@media (prefers-color-scheme:dark){:root{--panel:rgba(16,30,34,.94);--fg:#dff5f1;--muted:#9bb5b0;--line:#2c4a50;--acc:#5eead4;--bg:#0c1a1f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:fixed;inset:0}
.panel{position:absolute;z-index:2;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:252px;max-height:calc(100% - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;cursor:pointer;user-select:none}
.panel h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.panel h1 span{color:var(--acc)}
.panel .sub{font-size:12px;color:var(--muted)}
.toggle{border:0;background:none;color:var(--fg);font-size:18px;line-height:1;padding:2px 4px;cursor:pointer}
.body{padding:0 12px 10px}
.panel.collapsed .body{display:none}
.panel.collapsed .toggle{transform:rotate(180deg)}
ul.legend{list-style:none;margin:4px 0 10px;padding:0;font-size:13px}
ul.legend li{display:flex;align-items:center;gap:8px;padding:1px 0}
.sw{width:18px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.25);flex:none}
details.lg{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
details.lg summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.rsw{width:18px;height:6px;border-radius:3px;flex:none;border:1.5px solid}
.rsw.dash{height:0;border-width:0;border-top:2px dashed;border-radius:0}
.ctl{padding-top:2px;display:grid;gap:7px}
.ctl label{display:flex;align-items:center;gap:8px;cursor:pointer}
.ctl input[type=range]{width:100%;accent-color:var(--acc)}
.ctl input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;margin:0}
.ctl .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px;font-size:13px}
.ctl .grid label{gap:6px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.msg{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:42px;max-width:calc(100% - 32px);background:#7f1d1d;color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;display:none}
.maplibregl-popup-content{font:13px/1.4 system-ui,sans-serif;color:#1b2b2a;padding:8px 10px}
.maplibregl-popup-content b{font-weight:600}
@media (max-width:520px){.panel{width:min(252px,calc(100% - 70px));max-height:60%}}
/* Suche (search.mapx.at, Meilisearch) */
.search{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 572px))}
.search input{width:100%;height:38px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.12);-webkit-appearance:none;appearance:none}
.search input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:4px;top:4px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;display:none}
.search.has-text .clear{display:block}
.search ul{list-style:none;margin:4px 0 0;padding:4px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);max-height:min(60vh,420px);overflow:auto;display:none}
.search.open ul{display:block}
.search li{padding:6px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline}
.search li[aria-selected=true],.search li:hover{background:rgba(15,118,110,.12)}
.search li .t{grid-row:1/3;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);min-width:52px}
.search li .l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search li .c{grid-column:2;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search li.info{display:block;color:var(--muted);cursor:default;font-size:13px}
.search li.info:hover{background:none}
.search li.src{font-size:11px;border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
.rev .d{color:#5b6b69;font-size:12px}
@media (max-width:1000px){.search{left:max(276px,calc(env(safe-area-inset-left) + 272px));transform:none;width:calc(100% - 336px)}}
@media (max-width:520px){.search{left:max(10px,env(safe-area-inset-left));width:calc(100% - 66px)}.panel{top:calc(max(10px,env(safe-area-inset-top)) + 46px)}.search input{font-size:16px}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Vektor-Basemap"></div>

<section class="panel" id="panel">
  <header id="panelHead" title="Legende ein-/ausklappen">
    <div>
      <h1>map<span>x</span>.at</h1>
      <div class="sub">Vektor-Basemap · Melk, Landeck, Gmunden</div>
    </div>
    <button class="toggle" id="toggle" aria-label="Legende ein-/ausklappen" aria-expanded="true">▴</button>
  </header>
  <div class="body">
    <div class="ctl">
      <div class="grid">
        <label><input type="checkbox" id="bld" checked autocomplete="off"> Gebäude</label>
        <label><input type="checkbox" id="roads" checked autocomplete="off"> Straßen</label>
        <label><input type="checkbox" id="water" checked autocomplete="off"> Gewässer</label>
        <label><input type="checkbox" id="bnd" checked autocomplete="off"> Grenzen</label>
        <label><input type="checkbox" id="lab" checked autocomplete="off"> Beschriftung</label>
        <label><input type="checkbox" id="hnr" checked autocomplete="off"> Hausnummern</label>
        <label><input type="checkbox" id="rel" checked autocomplete="off"> Relief</label>
      </div>
      <label><input type="checkbox" id="bm" autocomplete="off"> basemap.at als Hintergrund</label>
      <label for="op">Deckkraft Nutzung</label>
      <input type="range" id="op" min="0" max="100" value="100" aria-label="Deckkraft der Nutzungsflächen">
    </div>
    <details class="lg" open><summary>Legende Nutzung</summary><ul class="legend" id="legend"></ul></details>
    <details class="lg"><summary>Legende Straßen</summary><ul class="legend" id="roadLegend"></ul></details>
    <div class="note">Antippen für Details, lange drücken/Rechtsklick für die nächste Adresse. Gebäude ab Zoom 13, Grundstücke ab 15, Hausnummern ab 16.</div>
  </div>
</section>

<div class="msg" id="msg"></div>

<div class="search" id="search">
  <input id="q" type="search" placeholder="Adresse, Ort, Gipfel, Grundstück …" autocomplete="off" autocapitalize="off" spellcheck="false"
         role="combobox" aria-label="Suche" aria-autocomplete="list" aria-expanded="false" aria-controls="results">
  <button class="clear" id="qclear" type="button" aria-label="Suche leeren">×</button>
  <ul id="results" role="listbox" aria-label="Suchergebnisse"></ul>
</div>

<script>
(function () {
  "use strict";

  // Der Kartenstil (alle Layer, Glyphs, Sprites, Legende) steht in style.json und wird mit
  // tools/build_style.py aus den Style-Fragmenten von mapx-at/vector-tiles erzeugt (siehe README).
  // Kachelquellen per Query-Parameter ueberschreibbar (Tests), z. B.
  //   ?gip=http://localhost:8000/gip-strassen.pmtiles&ggn=...&grenzen=...&geonamen=...&adr=...&dkm=...
  //   ?style=http://localhost:8000/style.json
  var params = new URLSearchParams(location.search);
  var SOURCE_PARAMS = ["dkm", "gip", "ggn", "grenzen", "geonamen", "adr", "oev", "relief", "hoehenlinien"];
  var STYLE_URL = /^https?:\/\//.test(params.get("style") || "") ? params.get("style") : "style.json";

  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return "&#" + ch.charCodeAt(0) + ";"; }); }

  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  var map = new maplibregl.Map({
    container: "map",
    center: [15.33, 48.23],
    zoom: 12,
    minZoom: 0,   // alle Zoomstufen wie basemap.at (Übersicht z0–7: Grenzen, Hauptstädte, Landuse ab z4, Netz ab z6)
    maxZoom: 19,
    hash: true,
    attributionControl: false,
    style: { version: 8, sources: {}, layers: [{ id: "bg0", type: "background", paint: { "background-color": "#f6f4ee" } }] }
  });

  window.mapxMap = map;   // fuer Tests/Konsole
  map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "top-right");
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), "top-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();

  var msg = document.getElementById("msg"), shown = false;
  function showMsg(text) { if (shown) return; shown = true; msg.textContent = text; msg.style.display = "block"; }
  map.on("error", function (e) {
    var src = e && e.sourceId;
    var text = e && e.error && e.error.message ? e.error.message : "";
    if (SOURCE_PARAMS.indexOf(src) >= 0 || /pmtiles|tiles\.mapx\.at/i.test(text)) {
      showMsg("Die Kacheln von tiles.mapx.at sind gerade nicht erreichbar.");
    }
  });

  var GROUPS = {}, HIDDEN = {}, LEGEND = null, ready = false;
  fetch(STYLE_URL).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (style) {
    SOURCE_PARAMS.forEach(function (k) {
      var v = params.get(k);
      if (v && /^https?:\/\//.test(v) && style.sources[k]) style.sources[k].url = "pmtiles://" + v;
    });
    var md = style.metadata || {};
    GROUPS = md["mapx:groups"] || {};
    // Layer, die der Style selbst ausschaltet (z. B. grenzen-label-gemeinde), bleiben aus
    style.layers.forEach(function (l) { if (l.layout && l.layout.visibility === "none") HIDDEN[l.id] = true; });
    LEGEND = md["mapx:legend"] || null;
    buildLegend();
    map.setStyle(style);
    map.once("styledata", function () {
      ready = true; applyAll();
      // Mobil: Quellenangabe eingeklappt starten (Info-Knopf klappt sie auf)
      map.once("idle", function () {
        var at = document.querySelector(".maplibregl-ctrl-attrib");
        if (at && window.matchMedia("(max-width: 520px)").matches) at.classList.remove("maplibregl-compact-show");
      });
    });
  }).catch(function () { showMsg("Der Kartenstil (style.json) konnte nicht geladen werden."); });

  // ---------------------------------------------------------------- Legende aus style.json
  function sw(cls, bg, border) {
    var s = document.createElement("span");
    s.className = cls;
    if (bg) s.style.background = bg;
    if (border) s.style.borderColor = border;
    return s;
  }
  function item(ul, swatch, text) {
    var li = document.createElement("li");
    li.appendChild(swatch); li.appendChild(document.createTextNode(text)); ul.appendChild(li);
  }
  function buildLegend() {
    if (!LEGEND) return;
    var legend = document.getElementById("legend"), roadLegend = document.getElementById("roadLegend");
    legend.innerHTML = ""; roadLegend.innerHTML = "";
    LEGEND.landuse.forEach(function (c) { item(legend, sw("sw", c[0]), c[1]); });
    var b = LEGEND.building; item(legend, sw("sw", b[0], b[1]), b[2]);
    LEGEND.roads.forEach(function (r) {
      var s = sw("rsw" + (r[3] ? " dash" : ""));
      if (r[3]) s.style.borderTopColor = r[2]; else { s.style.background = r[1]; s.style.borderColor = r[2]; }
      item(roadLegend, s, r[0]);
    });
  }

  // ---------------------------------------------------------------- Steuerung
  var bm = document.getElementById("bm"), op = document.getElementById("op");
  // Checkbox-ID -> Layergruppe(n) in metadata["mapx:groups"]
  var TOGGLES = { bld: ["buildings", "parcels"], roads: ["roads"], water: ["water"], bnd: ["boundaries"],
                  lab: ["labels"], hnr: ["housenumbers"], rel: ["relief"] };
  function groupIds(g) { return (GROUPS[g] || []).filter(function (id) { return !HIDDEN[id] && map.getLayer(id); }); }
  function setGroup(g, on) {
    groupIds(g).forEach(function (id) { map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); });
  }
  // Regler skaliert die basemap.at-Deckkraft: Nutzung 0,25, Siedlung deckend
  function applyOpacity() {
    var f = op.value / 100;
    if (map.getLayer("landuse")) map.setPaintProperty("landuse", "fill-opacity", 0.25 * f);
    if (map.getLayer("landuse-siedlung")) map.setPaintProperty("landuse-siedlung", "fill-opacity", f);
  }
  function applyAll() {
    if (!ready) return;
    Object.keys(TOGGLES).forEach(function (id) {
      var on = document.getElementById(id).checked;
      TOGGLES[id].forEach(function (g) { setGroup(g, on); });
    });
    if (map.getLayer("basemap")) map.setLayoutProperty("basemap", "visibility", bm.checked ? "visible" : "none");
    applyOpacity();
  }
  Object.keys(TOGGLES).forEach(function (id) { document.getElementById(id).addEventListener("change", applyAll); });
  bm.addEventListener("change", function () {
    // Mit Hintergrund die Nutzung etwas zuruecknehmen, ohne den Regler zu ueberschreiben.
    if (bm.checked && op.value > 60) { op.value = 60; }
    if (!bm.checked && op.value == 60) { op.value = 100; }
    applyAll();
  });
  op.addEventListener("input", applyOpacity);

  // Legende ein-/ausklappen (mobil standardmaessig zu)
  var panel = document.getElementById("panel"), tg = document.getElementById("toggle");
  function setCollapsed(c) { panel.classList.toggle("collapsed", c); tg.setAttribute("aria-expanded", String(!c)); }
  document.getElementById("panelHead").addEventListener("click", function () {
    setCollapsed(!panel.classList.contains("collapsed"));
  });
  if (window.matchMedia("(max-width: 520px)").matches) setCollapsed(true);

  // ---------------------------------------------------------------- Details per Klick
  var BRUNNEL = { bridge: "Brücke", tunnel: "Tunnel/Unterführung" };
  var WATER_CLASS = { river: "Fluss", stream: "Bach", canal: "Kanal", ditch: "Graben", lake: "See", pond: "Teich, Weiher" };
  var BOUNDARY = { state_l: "Staatsgrenze", country_l: "Landesgrenze", district_l: "Bezirksgrenze", municipality_l: "Gemeindegrenze" };
  var HR = "<hr style='border:0;border-top:1px solid #ddd;margin:5px 0'>";
  function visible(g) { return groupIds(g).filter(function (id) { return map.getLayoutProperty(id, "visibility") !== "none"; }); }
  function first(box, ids, pred) {
    if (!ids.length) return null;
    var f = map.queryRenderedFeatures(box, { layers: ids });
    for (var i = 0; i < f.length; i++) if (!pred || pred(f[i])) return f[i];
    return null;
  }
  map.on("click", function (e) {
    if (!ready) return;
    var pad = 4, box = [[e.point.x - pad, e.point.y - pad], [e.point.x + pad, e.point.y + pad]];
    var parts = [], namecats = (LEGEND && LEGEND.namecat) || {};
    var labels = (LEGEND && LEGEND.roadLabels) || {};
    var h = first(box, visible("housenumbers"));
    if (h) {
      var hp = h.properties || {};
      parts.push("<b>" + esc((hp.street ? hp.street + " " : "") + hp.hnr) + "</b><br>" +
                 (hp.type === "parcel" ? "Grundstücksadresse" : "Gebäudeadresse") + '<span class="adr"></span>');
    }
    var r = first(box, visible("roads"), function (f) { return f.layer.type === "line"; });
    if (r) {
      var rp = r.properties || {}, t = labels[rp.draw_class] || rp.draw_class;
      var rx = [];
      if (rp.name || rp.ref) rx.push(esc(t));
      if (rp.ref && rp.name) rx.push(esc(rp.ref));
      if (BRUNNEL[rp.brunnel]) rx.push(BRUNNEL[rp.brunnel]);
      if (rp.oneway == 1) rx.push("Einbahn");
      parts.push("<b>" + esc(rp.name || rp.ref || t) + "</b>" + (rx.length ? "<br>" + rx.join(" · ") : ""));
    }
    var w = first(box, visible("water").filter(function (id) { return id !== "water-dkm"; }));
    if (w) {
      var wp = w.properties || {}, wc = WATER_CLASS[wp["class"]] || "Gewässer", wx = [];
      if (wp.name) wx.push(esc(wc));
      if (wp.ezg_km2) wx.push("Einzugsgebiet " + Math.round(wp.ezg_km2).toLocaleString("de-AT") + " km²");
      if (wp.area_km2) wx.push(wp.area_km2 < 0.01 ? "< 1 ha" : wp.area_km2 < 1 ? Math.round(wp.area_km2 * 100) + " ha"
                               : (+wp.area_km2).toFixed(2).replace(".", ",") + " km²");
      if (wp.tunnel == 1) wx.push("verrohrt");
      parts.push("<b>" + esc(wp.name || wc) + "</b>" + (wx.length ? "<br>" + wx.join(" · ") : ""));
    }
    var bd = first(box, visible("boundaries"), function (f) { return f.layer.type === "line"; });
    if (bd) {
      var bp = bd.properties || {}, bs = "<b>" + (BOUNDARY[bd.sourceLayer] || "Grenze") + "</b>";
      if (bp.left && bp.right) bs += "<br>" + esc(bp.left) + " | " + esc(bp.right);
      else if (bp.right) bs += "<br>" + esc(bp.right);
      parts.push(bs);
    }
    var f = map.queryRenderedFeatures(e.point, { layers: ["building", "landuse", "parcel"].filter(function (id) { return map.getLayer(id); }) });
    var b = f.filter(function (x) { return x.layer.id === "building"; })[0];
    var l = f.filter(function (x) { return x.layer.id === "landuse"; })[0];
    var pc = first(box, visible("parcels"));
    var low = "";
    if (b) low += "<b>Gebäude</b><br>";
    if (l) {
      var p = l.properties || {};
      var cat = (p.usage == 59 || p.usage == 60) ? "Gewässer" : (namecats[p.namecat] || p.namecat);
      low += "<b>" + esc(cat || "unbekannt") + "</b>";
      if (p.usage != null && p.usage !== "") low += "<br>Nutzung (FIG): " + esc(p.usage);
    }
    if (pc && pc.properties && pc.properties.gstnr) low += "<br>Grenze Grundstück " + esc(pc.properties.gstnr) + " (KG " + esc(pc.properties.kgnr) + ")";
    if (low) parts.push(low);
    // Gemeinde/Bezirk am Klickpunkt aus der naechsten Adresse (Suchindex), bei Grenzen und Hausnummern
    var wantAdmin = !!(bd || h);
    if (!parts.length) return;
    var html = parts.join(HR) + (wantAdmin ? '<div class="adm d"></div>' : "");
    var pop = new maplibregl.Popup({ closeButton: true, maxWidth: "260px", className: "rev" }).setLngLat(e.lngLat).setHTML(html).addTo(map);
    if (wantAdmin) {
      nearestAddress(e.lngLat, 1500).then(function (a) {
        var el = pop.getElement(); if (!el || !a) return;
        var adm = el.querySelector(".adm");
        if (adm) adm.innerHTML = HR + "Gemeinde " + esc(a.municipality || "?") + " · Bezirk " + esc(a.district || "?") +
          (bd ? " <span class='d'>(am Klickpunkt)</span>" : "");
        var ad = el.querySelector(".adr");
        if (ad && h && a.plz) ad.innerHTML = "<br>" + esc(a.plz + " " + (a.postort || a.locality || ""));
      }).catch(function () {});
    }
  });
  map.on("mousemove", function (e) {
    if (!ready) return;
    var ids = visible("housenumbers").concat(visible("roads"), visible("water"), ["landuse"]).filter(function (id) { return map.getLayer(id); });
    map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers: ids }).length ? "pointer" : "";
  });

  // ---------------------------------------------------------------- Suche (Meilisearch, Index "places")
  // Endpoint und oeffentlicher Search-only-Key (darf nur /indexes/places/search, siehe
  // vector-tiles/search/README). Zum Testen per Query-Parameter ueberschreibbar:
  //   ?search=http://127.0.0.1:7701&searchKey=<key>
  var SEARCH_URL = "https://search.mapx.at";
  var SEARCH_KEY = "3b491fdde284848f13402921b4a8bde5ee0221adf77e04594390b21f079beaa8";   // oeffentlicher Search-only-Key (nur Index places, Aktion search)
  var SEARCH_INDEX = "places";
  (function () {
    var p = new URLSearchParams(location.search);
    if (p.get("search")) SEARCH_URL = p.get("search").replace(/\/+$/, "");
    if (p.get("searchKey")) SEARCH_KEY = p.get("searchKey");
  })();

  var TYPE_LABEL = { address: "Adresse", street: "Straße", locality: "Ortschaft", place: "Ort", municipality: "Gemeinde",
                     district: "Bezirk", state: "Land", parcel: "Grundst.", postcode: "PLZ" };
  var CLASS_LABEL = { gipfel: "Gipfel", stadt: "Stadt", markt: "Markt", dorf: "Dorf", einzelhaus: "Haus", ried: "Ried",
                      kirche: "Kirche", schloss: "Schloss", burg: "Burg", ruine: "Ruine", huette: "Hütte", tal: "Tal",
                      pass: "Pass", gebiet: "Gebiet", gewaesser: "Gewässer", gletscher: "Gletscher" };
  var ATTRS = ["id", "type", "class", "label", "name", "context", "_geo", "bbox", "zoom"];

  function meili(body, signal) {
    var h = { "Content-Type": "application/json" };
    if (SEARCH_KEY) h.Authorization = "Bearer " + SEARCH_KEY;
    return fetch(SEARCH_URL + "/indexes/" + SEARCH_INDEX + "/search", {
      method: "POST", headers: h, body: JSON.stringify(body), signal: signal
    }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }

  var box = document.getElementById("search"), input = document.getElementById("q"),
      list = document.getElementById("results"), clearBtn = document.getElementById("qclear");
  var hits = [], active = -1, timer = null, ctrl = null, marker = null, seq = 0;

  function setOpen(o) { box.classList.toggle("open", o); input.setAttribute("aria-expanded", String(o)); }
  function info(text) { list.innerHTML = '<li class="info" role="option" aria-disabled="true">' + esc(text) + "</li>"; setOpen(true); }

  function render() {
    list.innerHTML = "";
    hits.forEach(function (h, i) {
      var li = document.createElement("li");
      li.id = "res-" + i; li.setAttribute("role", "option"); li.setAttribute("aria-selected", String(i === active));
      var t = (h.type === "place" && CLASS_LABEL[h["class"]]) || TYPE_LABEL[h.type] || h.type;
      li.innerHTML = '<span class="t">' + esc(t) + '</span><span class="l">' + esc(h.label || h.name) +
                     '</span><span class="c">' + esc(h.context || "") + "</span>";
      li.addEventListener("mousedown", function (ev) { ev.preventDefault(); choose(i); });
      list.appendChild(li);
    });
    var src = document.createElement("li");
    src.className = "info src"; src.setAttribute("aria-hidden", "true");
    src.textContent = "Daten: BEV – Adressregister, Geonamen, Verwaltungsgrenzen, DKM (CC BY 4.0)";
    list.appendChild(src);
    if (active >= 0) input.setAttribute("aria-activedescendant", "res-" + active); else input.removeAttribute("aria-activedescendant");
    setOpen(hits.length > 0);
  }

  function search(q) {
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    var my = ++seq;
    meili({ q: q, limit: 8, attributesToRetrieve: ATTRS }, ctrl.signal).then(function (j) {
      if (my !== seq) return;
      hits = j.hits || []; active = hits.length ? 0 : -1;
      if (!hits.length) info("Keine Treffer"); else render();
    }).catch(function (e) {
      if (e.name === "AbortError") return;
      hits = []; info("Suche gerade nicht erreichbar");
    });
  }

  input.addEventListener("input", function () {
    var q = input.value.trim();
    box.classList.toggle("has-text", input.value.length > 0);
    clearTimeout(timer);
    if (q.length < 2) { hits = []; active = -1; setOpen(false); if (ctrl) ctrl.abort(); return; }
    timer = setTimeout(function () { search(q); }, 180);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!hits.length) return;
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
      render();
      var el = document.getElementById("res-" + active); if (el) el.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (hits.length) choose(active >= 0 ? active : 0);
    } else if (e.key === "Escape") {
      if (box.classList.contains("open")) setOpen(false); else { input.value = ""; box.classList.remove("has-text"); }
    }
  });
  input.addEventListener("focus", function () { if (hits.length) render(); });
  input.addEventListener("blur", function () { setTimeout(function () { setOpen(false); }, 120); });
  clearBtn.addEventListener("click", function () {
    input.value = ""; box.classList.remove("has-text"); hits = []; setOpen(false);
    if (marker) { marker.remove(); marker = null; }
    input.focus();
  });

  function choose(i) {
    var h = hits[i]; if (!h || !h._geo) return;
    input.value = h.label || h.name; box.classList.add("has-text");
    setOpen(false); input.blur();
    var ll = [h._geo.lng, h._geo.lat];
    if (marker) marker.remove();
    marker = new maplibregl.Marker({ color: "#0f766e" }).setLngLat(ll)
      .setPopup(new maplibregl.Popup({ offset: 28, maxWidth: "260px" })
        .setHTML("<b>" + esc(h.label || h.name) + "</b><br>" + esc(h.context || "")))
      .addTo(map);
    var b = h.bbox, z = h.zoom || 15;
    // Flaechen (Gemeinde, Bezirk, Strasse, Grundstueck ...) mit bbox einpassen, Punkte anfliegen
    if (b && b.length === 4 && (b[2] - b[0] > 0.0004 || b[3] - b[1] > 0.0003)) {
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 50, maxZoom: Math.min(19, z + 1), duration: 1200 });
    } else {
      map.flyTo({ center: ll, zoom: Math.max(map.getZoom(), z), speed: 1.6 });
    }
  }

  // Naechster Treffer zu einem Punkt. _geoBoundingBox (Quadrat +-radius) statt _geoRadius: in Meilisearch
  // 1.56 ~1 ms statt ~100 ms. Treffer in den Ecken (bis radius*1.41) werden verworfen.
  function geoNear(filter, lat, lng, radius) {
    var dlat = radius / 111320, dlng = radius / (111320 * Math.cos(lat * Math.PI / 180));
    var bb = "_geoBoundingBox([" + (lat + dlat).toFixed(6) + ", " + (lng + dlng).toFixed(6) + "], [" +
             (lat - dlat).toFixed(6) + ", " + (lng - dlng).toFixed(6) + "])";
    return meili({ q: "", limit: 1, attributesToRetrieve: ATTRS.concat(["municipality", "district", "plz", "postort", "locality"]),
                   filter: filter + " AND " + bb, sort: ["_geoPoint(" + lat + ", " + lng + "):asc"] }).then(function (j) {
      var h = j.hits && j.hits[0];
      return { hits: h && h._geoDistance <= radius ? [h] : [] };
    });
  }
  function nearestAddress(lngLat, radius) {
    return geoNear("type = address", +lngLat.lat.toFixed(6), +lngLat.lng.toFixed(6), radius).then(function (j) { return j.hits[0]; });
  }

  // Rechtsklick / langes Druecken -> Reverse-Geocoding (naechste Adresse, sonst naechster Ort/Strasse)
  var lastRev = 0, revPop = null;
  function reverse(lngLat) {
    var now = Date.now(); if (now - lastRev < 800) return; lastRev = now;
    if (revPop) revPop.remove();
    var lat = +lngLat.lat.toFixed(6), lng = +lngLat.lng.toFixed(6);
    // closeOnClick aus: das Loslassen nach langem Druecken loest auf manchen Geraeten einen Klick aus
    var pop = revPop = new maplibregl.Popup({ closeButton: true, closeOnClick: false, maxWidth: "260px", className: "rev" })
      .setLngLat(lngLat).setHTML('<span class="d">Suche …</span>').addTo(map);
    function q(filter, radius) { return geoNear(filter, lat, lng, radius); }
    var coord = '<span class="d">' + lat.toFixed(5) + ", " + lng.toFixed(5) + "</span>";
    q("type = address", 150).then(function (j) {
      if (j.hits && j.hits.length) return j.hits[0];
      return q("type IN [street, locality, place]", 3000).then(function (k) { return k.hits && k.hits[0]; });
    }).then(function (h) {
      if (!h) { pop.setHTML("Nichts in der Nähe gefunden<br>" + coord); return; }
      var d = h._geoDistance != null ? Math.round(h._geoDistance) + " m · " : "";
      pop.setHTML("<b>" + esc(h.label || h.name) + "</b><br>" + esc(h.context || "") +
                  '<br><span class="d">' + esc(TYPE_LABEL[h.type] || h.type) + " · " + d + "</span>" + coord);
    }).catch(function () { pop.setHTML("Suche gerade nicht erreichbar<br>" + coord); });
  }
  map.on("contextmenu", function (e) { reverse(e.lngLat); });
  // Langes Druecken (600 ms, < 10 px Bewegung, ein Finger) direkt an den DOM-Touch-Events des Kartencontainers
  var lpTimer = null, lpStart = null, mapEl = map.getCanvasContainer();
  function lpCancel() { clearTimeout(lpTimer); lpTimer = null; }
  mapEl.addEventListener("touchstart", function (e) {
    lpCancel();
    if (e.touches.length !== 1) return;
    var r = mapEl.getBoundingClientRect(), t = e.touches[0];
    lpStart = { x: t.clientX, y: t.clientY };
    var ll = map.unproject([t.clientX - r.left, t.clientY - r.top]);
    lpTimer = setTimeout(function () { lpTimer = null; reverse(ll); }, 600);
  }, { passive: true });
  mapEl.addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (!lpStart || e.touches.length !== 1 || Math.abs(t.clientX - lpStart.x) > 10 || Math.abs(t.clientY - lpStart.y) > 10) lpCancel();
  }, { passive: true });
  mapEl.addEventListener("touchend", lpCancel, { passive: true });
  mapEl.addEventListener("touchcancel", lpCancel, { passive: true });
})();
</script>
</body>
</html>
